<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>window.Chart||document.write('<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"><\/script>')</script>
<style>
:root{--ink:#10262b;--side:#0f2a2e;--bg:#f2f5f6;--card:#fff;--line:#e3e9eb;--pri:#0e7c86;--pri2:#0a5f67;--in:#2f6fd6;--out:#d6563c;--warn:#e0a100;--mut:#6b7f84}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);color:#cfe3e5;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
aside h1{font-size:20px;font-weight:800;color:#fff;margin:0 8px 22px}
aside a{padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:#a9c4c7}
aside a:hover{background:#17393e}aside a.on{background:var(--pri);color:#fff}
aside .bot{margin-top:auto;font-size:12px;padding:8px}
aside .bot button{margin-top:8px;width:100%;background:#17393e;color:#cfe3e5;border:0;padding:9px;border-radius:8px;cursor:pointer}
main{margin-left:220px;padding:26px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px;font-weight:800}
.rate{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;gap:8px;align-items:center;font-weight:600}
.rate input{width:90px;border:1px solid var(--line);border-radius:8px;padding:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;border-left:5px solid var(--pri)}
.kpi small{color:var(--mut);font-weight:600}.kpi b{display:block;font-size:24px;margin-top:6px;font-weight:800}
.kpi.in{border-left-color:var(--in)}.kpi.out{border-left-color:var(--out)}.kpi.warn{border-left-color:var(--warn)}
.kpi i{font-style:normal;color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{width:100%;min-width:60px;border:1px solid transparent;border-radius:8px;padding:6px;background:#f7fafa}
td input:focus,input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.tw{overflow-x:auto}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.s{padding:5px 9px;font-size:12px}.btn.g{background:#e8eff0;color:var(--ink)}.btn.r{background:var(--out)}.btn.w{background:var(--warn);color:#222}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.f input,.f select,.inp{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
.tag{padding:3px 8px;border-radius:20px;font-size:12px;font-weight:600;background:#e4f5ee;color:#16774f}
.tag.low{background:#fdf0cf;color:#8a6200}.tag.dev{background:#fde6e1;color:#a3321c}
.pos{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:300px;overflow:auto}
.pc{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fafcfc}.pc:hover{border-color:var(--pri)}
.pc b{display:block}.pc small{color:var(--mut)}
.cart .row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.cart .row input{width:56px;border:1px solid var(--line);border-radius:8px;padding:5px}
.tot{font-size:22px;font-weight:800;margin:12px 0}
#login{max-width:360px;margin:12vh auto;background:#fff;border-radius:18px;padding:28px;border:1px solid var(--line)}
#login h1{margin:0 0 4px}#login input{width:100%;margin:6px 0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}
#modal>div{background:#fff;border-radius:16px;padding:22px;min-width:320px;max-width:94vw}
#modal .row{display:flex;justify-content:space-between;gap:12px;margin:8px 0;align-items:center}
#modal input[type=number]{width:70px;padding:5px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;display:none;z-index:10}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:860px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:10px}aside h1,aside .bot{display:none}main{margin:0;padding:16px}.pos,.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login">
  <h1>Mi ERP</h1><p style="color:var(--mut);margin:0 0 12px">Inicia sesión para ver tu negocio.</p>
  <input class="inp" id="em" type="email" placeholder="Correo">
  <input class="inp" id="pw" type="password" placeholder="Contraseña">
  <div class="f" style="margin-top:10px"><button class="btn" onclick="auth('in')">Entrar</button><button class="btn g" onclick="auth('up')">Crear cuenta</button></div>
  <div id="err" style="color:#a3321c;font-size:13px;min-height:18px"></div><small style="color:var(--mut)">versión 4</small>
</div>
<div id="app">
  <aside>
    <h1>Mi ERP</h1>
    <a data-t="inicio" class="on">Inicio</a><a data-t="inventario">Inventario</a><a data-t="ventas">Ventas</a><a data-t="gastos">Gastos y reportes</a>
    <div class="bot"><span id="who"></span><button onclick="sb.auth.signOut()">Cerrar sesión</button></div>
  </aside>
  <main>
    <div class="top"><h2 id="title"></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="rate">Tasa Bs/USD <input id="rate" type="number" step="0.01" onchange="setCfg('rate',this.value)"></div>
      <div class="rate">IVA % <input id="iva" type="number" step="0.01" min="0" onchange="setCfg('iva',this.value)"></div></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal" onclick="if(event.target===this)closeM()"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
// ====== CONFIGURA AQUÍ (Supabase > Project Settings > API) ======
const SUPABASE_URL = 'https://celnhdxkysgioowkgaqp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mYdmgAOsD4j1zWI945jOcQ_QjGKlJTS';
// =================================================================
const showErr=m=>{const e=document.getElementById('err'); if(e&&!e.textContent) e.textContent='Error: '+m;};
window.addEventListener('error',e=>showErr(e.message));
window.addEventListener('unhandledrejection',e=>showErr(e.reason?.message||e.reason));
if(typeof supabase==='undefined') showErr('No se cargó la librería de Supabase. Revisa tu internet o desactiva bloqueadores de anuncios.');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = {products:[],sales:[],items:[],expenses:[],rate:1,iva:16,ivaPct:null,cart:[],editing:null,tab:'inicio'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + (+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const bs = (n, r = S.rate) => 'Bs ' + (n * r).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const toast = m => { const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2600); };
const openM = h => { $('#mbox').innerHTML=h; $('#modal').style.display='flex'; };
const closeM = () => $('#modal').style.display='none';
const month = d => String(d).slice(0,7);

// ---------- Sesión (se mantiene guardada en el navegador) ----------
async function auth(kind){
  const err=$('#err'); err.textContent='';
  try{
    const email=$('#em').value.trim(), password=$('#pw').value;
    if(!email||!password){ err.textContent='Escribe tu correo y contraseña.'; return; }
    err.textContent='Entrando…';
    const r = kind==='in' ? await sb.auth.signInWithPassword({email,password}) : await sb.auth.signUp({email,password});
    if(r.error){ err.textContent=r.error.message; return; }
    err.textContent='';
    if(kind==='up' && !r.data.session) toast('Revisa tu correo para confirmar la cuenta');
  }catch(e){ err.textContent='Error: '+e.message; }
}
let curUser=null;
sb.auth.onAuthStateChange((_e, session) => {
  $('#login').style.display = session ? 'none' : 'block';
  $('#app').style.display = session ? 'block' : 'none';
  if(session){ if(curUser!==session.user.id){ curUser=session.user.id; $('#who').textContent = session.user.email; load(true); subscribe(); } }
  else curUser=null;
});
let chan, timer;
function subscribe(){
  if(chan) return;
  chan = sb.channel('erp').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(timer);timer=setTimeout(()=>load(false),400)}).subscribe();
}

// ---------- Datos ----------
async function load(force){
  const [p,s,i,e,c] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('sales').select('*').order('id',{ascending:false}),
    sb.from('sale_items').select('*'),
    sb.from('expenses').select('*').order('date',{ascending:false}),
    sb.from('settings').select('*').eq('id',1).maybeSingle()]);
  S.products=p.data||[]; S.sales=s.data||[]; S.items=i.data||[]; S.expenses=e.data||[]; S.rate=+(c.data?.rate||1); S.iva=+(c.data?.iva ?? 16);
  $('#rate').value = S.rate; $('#iva').value = S.iva;
  if(force || document.activeElement?.tagName!=='INPUT') render();
}
async function setCfg(k,v){ await sb.from('settings').upsert({id:1,[k]:+v}); await load(true); toast(k==='rate'?'Tasa actualizada':'IVA por defecto actualizado'); }

document.querySelectorAll('aside a').forEach(a => a.onclick = () => {
  S.tab=a.dataset.t; document.querySelectorAll('aside a').forEach(x=>x.classList.toggle('on',x===a)); render();
});
function render(){
  const keep={}; document.querySelectorAll('#view [id]').forEach(e=>{ if('value' in e && e.type!=='checkbox') keep[e.id]=e.value; });
  const t={inicio:['Inicio',vInicio],inventario:['Inventario',vInv],ventas:['Ventas',vVentas],gastos:['Gastos y reportes',vGastos]}[S.tab];
  $('#title').textContent=t[0]; $('#view').innerHTML=t[1](); if(S.tab==='inicio') drawChart();
  for(const k in keep){ const e=document.getElementById(k); if(e && 'value' in e) e.value=keep[k]; }
}

// ---------- Inicio ----------
function monthly(){
  const m={}; const k=new Date();
  for(let n=5;n>=0;n--){ const d=new Date(k.getFullYear(),k.getMonth()-n,1); m[d.toISOString().slice(0,7)]={in:0,out:0}; }
  S.sales.forEach(s=>{const x=m[month(new Date(s.created_at).toISOString())]; if(x) x.in+=+s.subtotal_usd});
  S.expenses.forEach(e=>{const x=m[month(e.date)]; if(x) x.out+=+e.amount_usd});
  return m;
}
function vInicio(){
  const today=new Date().toDateString(), mk=month(new Date().toISOString());
  const vh=S.sales.filter(s=>new Date(s.created_at).toDateString()===today).reduce((a,s)=>a+ +s.subtotal_usd,0);
  const m=monthly()[mk]||{in:0,out:0}; const low=S.products.filter(p=>p.stock<=p.min_stock);
  const val=S.products.reduce((a,p)=>a+p.stock*p.price_usd,0);
  return `<div class="kpis">
   <div class="kpi in"><small>Ventas de hoy</small><b>${usd(vh)}</b><i>${bs(vh)}</i></div>
   <div class="kpi in"><small>Ingresos del mes</small><b>${usd(m.in)}</b><i>${bs(m.in)}</i></div>
   <div class="kpi out"><small>Gastos del mes</small><b>${usd(m.out)}</b><i>${bs(m.out)}</i></div>
   <div class="kpi"><small>Utilidad del mes</small><b>${usd(m.in-m.out)}</b><i>${bs(m.in-m.out)}</i></div>
   <div class="kpi"><small>Valor del inventario</small><b>${usd(val)}</b><i>${bs(val)}</i></div>
   <div class="kpi warn"><small>Productos con stock bajo</small><b>${low.length}</b><i>${low.slice(0,3).map(p=>esc(p.name)).join(', ')||'Todo en orden'}</i></div></div>
   <div class="card"><h3>Ingresos vs. gastos (últimos 6 meses, USD)</h3><canvas id="ch" height="90"></canvas></div>`;
}
let chart;
function drawChart(){
  const m=monthly(), l=Object.keys(m); if(chart) chart.destroy();
  chart=new Chart($('#ch'),{type:'bar',data:{labels:l,datasets:[
    {label:'Ingresos',data:l.map(k=>m[k].in),backgroundColor:'#2f6fd6',borderRadius:6},
    {label:'Gastos',data:l.map(k=>m[k].out),backgroundColor:'#d6563c',borderRadius:6}]},options:{plugins:{legend:{position:'bottom'}}}});
}

// ---------- Inventario ----------
function vInv(){
  return `<div class="card"><h3>Nuevo producto</h3><div class="f">
   <input id="np-n" placeholder="Nombre"><input id="np-s" placeholder="Código (SKU)"><input id="np-p" type="number" step="0.01" placeholder="Precio USD">
   <input id="np-k" type="number" placeholder="Stock"><input id="np-m" type="number" placeholder="Stock mínimo" value="5">
   <button class="btn" onclick="addProd()">Agregar</button></div></div>
   <div class="card"><h3>Catálogo <small style="color:var(--mut)">(edita directo en la tabla)</small></h3><div class="tw"><table>
   <tr><th>Producto</th><th>SKU</th><th>Precio USD</th><th>Precio Bs</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th></th></tr>
   ${S.products.map(p=>`<tr><td><input value="${esc(p.name)}" onchange="upP(${p.id},'name',this.value)"></td>
   <td><input value="${esc(p.sku)}" onchange="upP(${p.id},'sku',this.value)"></td>
   <td><input type="number" step="0.01" value="${p.price_usd}" onchange="upP(${p.id},'price_usd',+this.value)"></td>
   <td>${bs(p.price_usd)}</td>
   <td><input type="number" value="${p.stock}" onchange="upP(${p.id},'stock',+this.value)"></td>
   <td><input type="number" value="${p.min_stock}" onchange="upP(${p.id},'min_stock',+this.value)"></td>
   <td><span class="tag ${p.stock<=p.min_stock?'low':''}">${p.stock<=p.min_stock?'Stock bajo':'OK'}</span></td>
   <td><button class="btn s r" onclick="delP(${p.id})">Borrar</button></td></tr>`).join('')||'<tr><td colspan=8>Aún no hay productos. Agrega el primero arriba.</td></tr>'}
   </table></div></div>`;
}
async function addProd(){
  const name=$('#np-n').value.trim(); if(!name) return toast('Escribe el nombre');
  await sb.from('products').insert({name,sku:$('#np-s').value,price_usd:+$('#np-p').value||0,stock:+$('#np-k').value||0,min_stock:+$('#np-m').value||0});
  ['np-n','np-s','np-p','np-k'].forEach(i=>$('#'+i).value=''); $('#np-m').value=5; await load(true); toast('Producto agregado');
}
async function upP(id,f,v){ await sb.from('products').update({[f]:v}).eq('id',id); await load(true); toast('Guardado'); }
async function delP(id){ if(!confirm('¿Borrar este producto?')) return; await sb.from('products').delete().eq('id',id); await load(true); }

// ---------- Ventas (POS + historial) ----------
function vVentas(){
  const q=(window.q||'').toLowerCase(); const sub=S.cart.reduce((a,c)=>a+c.qty*c.price,0), pct=S.ivaPct??S.iva, tax=sub*pct/100, tot=sub+tax;
  const list=S.products.filter(p=>p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q));
  return `<div class="pos"><div>
   <div class="card"><h3>Productos</h3><div class="f"><input id="q" placeholder="Buscar por nombre o SKU" value="${esc(window.q||'')}" oninput="window.q=this.value;render();document.getElementById('q').focus()" style="flex:1"></div>
   <div class="pg">${list.map(p=>`<div class="pc" onclick="addCart(${p.id})"><b>${esc(p.name)}</b><span>${usd(p.price_usd)}</span><br><small>${bs(p.price_usd)} · stock ${p.stock}</small></div>`).join('')||'Sin resultados'}</div></div>
   <div class="card"><h3>Historial de ventas</h3><div class="tw"><table><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acciones</th></tr>
   ${S.sales.map(s=>`<tr><td>#${s.id}</td><td>${new Date(s.created_at).toLocaleString('es-VE')}</td><td>${esc(s.customer)}</td>
   <td>${usd(s.total_usd)}<br><small>${bs(s.total_usd,s.rate)}</small></td><td><span class="tag ${s.status!=='completada'?'dev':''}">${s.status}</span></td>
   <td style="white-space:nowrap"><button class="btn s g" onclick="printSale(${s.id})">Imprimir</button> <button class="btn s w" onclick="editSale(${s.id})">Editar</button>
   <button class="btn s g" onclick="returnModal(${s.id})">Devolver</button> <button class="btn s r" onclick="delSale(${s.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=6>Todavía no hay ventas.</td></tr>'}</table></div></div></div>
   <div class="card cart"><h3>${S.editing?'Editando venta #'+S.editing:'Venta actual'}</h3>
   <input class="inp" id="cust" placeholder="Cliente (opcional)" style="width:100%;margin-bottom:8px" value="${esc(S.cust||'')}" oninput="S.cust=this.value">
   ${S.cart.map((c,i)=>`<div class="row"><span>${esc(c.name)}<br><small>${usd(c.price)}</small></span><span><input type="number" min="1" value="${c.qty}" onchange="S.cart[${i}].qty=Math.max(1,+this.value);render()"> <button class="btn s r" onclick="S.cart.splice(${i},1);render()">×</button></span></div>`).join('')||'<p style="color:var(--mut)">Toca un producto para agregarlo.</p>'}
   <div style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px">
   <div class="row" style="border:0"><span>Subtotal</span><span>${usd(sub)}</span></div>
   <div class="row" style="border:0"><span>IVA <input type="number" step="0.01" min="0" value="${pct}" onchange="S.ivaPct=+this.value;render()"> %</span><span>${usd(tax)}</span></div></div>
   <div class="tot">Total ${usd(tot)}<br><small style="font-size:13px;color:var(--mut)">${bs(tot)}</small></div>
   <button class="btn" style="width:100%" onclick="checkout()">${S.editing?'Guardar cambios':'Cobrar'}</button>
   ${S.editing?'<button class="btn g" style="width:100%;margin-top:8px" onclick="S.editing=null;S.cart=[];S.ivaPct=null;render()">Cancelar edición</button>':''}</div></div>`;
}
function addCart(id){
  const p=S.products.find(x=>x.id===id), c=S.cart.find(x=>x.id===id);
  if(c) c.qty++; else S.cart.push({id,name:p.name,price:+p.price_usd,qty:1}); render();
}
async function checkout(){
  if(!S.cart.length) return toast('El carrito está vacío');
  const old={}, nw={}; let sale=null;
  if(S.editing){ sale=S.sales.find(x=>x.id==S.editing); S.items.filter(i=>i.sale_id==sale.id).forEach(i=>old[i.product_id]=(old[i.product_id]||0)+i.qty); }
  S.cart.forEach(c=>nw[c.id]=(nw[c.id]||0)+c.qty);
  for(const pid in nw){ const p=S.products.find(x=>x.id==pid); if(nw[pid]-(old[pid]||0)>p.stock) return toast('Stock insuficiente: '+p.name); }
  const sub=S.cart.reduce((a,c)=>a+c.qty*c.price,0), pct=S.ivaPct??S.iva, total=sub*(1+pct/100); let id;
  if(sale){ id=sale.id; await sb.from('sales').update({subtotal_usd:sub,iva_pct:pct,total_usd:total,customer:S.cust||null}).eq('id',id); await sb.from('sale_items').delete().eq('sale_id',id); }
  else { const r=await sb.from('sales').insert({subtotal_usd:sub,iva_pct:pct,total_usd:total,rate:S.rate,customer:S.cust||null}).select().single(); if(r.error) return toast(r.error.message); id=r.data.id; }
  await sb.from('sale_items').insert(S.cart.map(c=>({sale_id:id,product_id:c.id,name:c.name,qty:c.qty,price_usd:c.price})));
  for(const pid of new Set([...Object.keys(old),...Object.keys(nw)])){ const d=(old[pid]||0)-(nw[pid]||0); if(d) await sb.rpc('adjust_stock',{pid:+pid,delta:d}); }
  const wasEdit=!!S.editing; S.cart=[]; S.editing=null; S.cust=''; S.ivaPct=null; await load(true); toast(wasEdit?'Venta actualizada':'Venta registrada');
}
function editSale(id){
  const it=S.items.filter(i=>i.sale_id==id);
  if(it.some(i=>i.returned_qty>0)) return toast('Esta venta tiene devoluciones y no se puede editar');
  S.cart=it.map(i=>({id:i.product_id,name:i.name,price:+i.price_usd,qty:i.qty})); S.editing=id; const sv=S.sales.find(s=>s.id==id); S.cust=sv.customer; S.ivaPct=+sv.iva_pct; render(); scrollTo(0,0);
}
function returnModal(id){
  const it=S.items.filter(i=>i.sale_id==id&&i.qty>i.returned_qty); if(!it.length) return toast('No queda nada por devolver');
  openM(`<h3>Devolución de la venta #${id}</h3>${it.map(i=>`<div class="row"><span>${esc(i.name)} (máx. ${i.qty-i.returned_qty})</span><input type="number" min="0" max="${i.qty-i.returned_qty}" value="0" data-r="${i.id}"></div>`).join('')}
  <label><input type="checkbox" id="rs" checked> Reingresar la mercancía al stock</label>
  <div class="f" style="margin-top:14px"><button class="btn" onclick="doReturn(${id})">Confirmar devolución</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`);
}
async function doReturn(id){
  const restock=$('#rs').checked; let ref=0;
  for(const inp of document.querySelectorAll('[data-r]')){
    const it=S.items.find(i=>i.id==inp.dataset.r), r=Math.min(+inp.value||0,it.qty-it.returned_qty); if(r<=0) continue;
    await sb.from('sale_items').update({returned_qty:it.returned_qty+r,restocked_qty:it.restocked_qty+(restock?r:0)}).eq('id',it.id);
    if(restock&&it.product_id) await sb.rpc('adjust_stock',{pid:it.product_id,delta:r}); ref+=r*it.price_usd; it.returned_qty+=r;
  }
  const s=S.sales.find(x=>x.id==id), all=S.items.filter(i=>i.sale_id==id).every(i=>i.returned_qty>=i.qty);
  if(ref>0){ const ns=Math.max(0,s.subtotal_usd-ref); await sb.from('sales').update({subtotal_usd:ns,total_usd:ns*(1+s.iva_pct/100),status:all?'devuelta':'parcial'}).eq('id',id); }
  closeM(); await load(true); toast('Devolución registrada');
}
async function delSale(id){
  if(!confirm('¿Anular la venta #'+id+' y devolver toda la mercancía al inventario?')) return;
  for(const i of S.items.filter(x=>x.sale_id==id)){ const back=i.qty-i.restocked_qty; if(back>0&&i.product_id) await sb.rpc('adjust_stock',{pid:i.product_id,delta:back}); }
  await sb.from('sales').delete().eq('id',id); await load(true); toast('Venta anulada');
}
function printSale(id){
  const s=S.sales.find(x=>x.id==id), it=S.items.filter(i=>i.sale_id==id), w=open('','_blank');
  w.document.write(`<html><body style="font-family:sans-serif;max-width:520px;margin:30px auto"><h2>Factura #${id}</h2><p>${new Date(s.created_at).toLocaleString('es-VE')}<br>Cliente: ${esc(s.customer)||'—'}<br>Tasa: ${s.rate} Bs/USD</p>
  <table style="width:100%;border-collapse:collapse"><tr><th align=left>Producto</th><th>Cant.</th><th align=right>USD</th><th align=right>Bs</th></tr>
  ${it.map(i=>{const q=i.qty-i.returned_qty;return `<tr><td>${esc(i.name)}</td><td align=center>${q}</td><td align=right>${usd(q*i.price_usd)}</td><td align=right>${bs(q*i.price_usd,s.rate)}</td></tr>`}).join('')}</table>
  <p style="text-align:right">Subtotal: ${usd(s.subtotal_usd)}<br>IVA (${+s.iva_pct}%): ${usd(s.total_usd-s.subtotal_usd)}</p><h3 style="text-align:right">Total: ${usd(s.total_usd)} / ${bs(s.total_usd,s.rate)}</h3></body></html>`);
  w.document.close(); w.print();
}

// ---------- Gastos y reportes ----------
function vGastos(){
  return `<div class="cols"><div><div class="card"><h3>Registrar gasto</h3><div class="f">
   <input id="g-c" placeholder="Concepto"><select id="g-k"><option>General</option><option>Servicios</option><option>Nómina</option><option>Alquiler</option><option>Compras</option><option>Impuestos</option></select>
   <input id="g-a" type="number" step="0.01" placeholder="Monto USD"><input id="g-d" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn" onclick="addExp()">Guardar</button></div></div>
   <div class="card"><h3>Egresos</h3><div class="tw"><table><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>USD</th><th>Bs</th><th></th></tr>
   ${S.expenses.map(e=>`<tr><td>${e.date}</td><td>${esc(e.concept)}</td><td>${esc(e.category)}</td><td>${usd(e.amount_usd)}</td><td>${bs(e.amount_usd)}</td><td><button class="btn s r" onclick="delExp(${e.id})">×</button></td></tr>`).join('')||'<tr><td colspan=6>Sin gastos registrados.</td></tr>'}</table></div></div></div>
   <div class="card"><h3>Descargar reportes</h3><p style="color:var(--mut)">Archivos CSV que abren directo en Excel.</p>
   <div style="display:grid;gap:8px"><button class="btn" onclick="rep('fin')">Matriz financiera mensual</button><button class="btn" onclick="rep('inv')">Matriz de inventario</button>
   <button class="btn g" onclick="rep('ven')">Detalle de ventas</button><button class="btn g" onclick="rep('gas')">Detalle de gastos</button></div></div></div>`;
}
async function addExp(){
  const concept=$('#g-c').value.trim(), amount_usd=+$('#g-a').value; if(!concept||!amount_usd) return toast('Completa concepto y monto');
  await sb.from('expenses').insert({concept,amount_usd,category:$('#g-k').value,date:$('#g-d').value}); $('#g-c').value=''; $('#g-a').value=''; await load(true); toast('Gasto guardado');
}
async function delExp(id){ if(confirm('¿Borrar este gasto?')){ await sb.from('expenses').delete().eq('id',id); await load(true); } }
function csv(name, rows){
  const t=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'})); a.download=name+'_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function rep(k){
  if(k==='fin'){ const all={}; S.sales.forEach(s=>{const m=month(new Date(s.created_at).toISOString()); all[m]=all[m]||{in:0,out:0}; all[m].in+=+s.subtotal_usd});
    S.expenses.forEach(e=>{const m=month(e.date); all[m]=all[m]||{in:0,out:0}; all[m].out+=+e.amount_usd});
    csv('matriz_financiera',[['Mes','Ingresos USD (sin IVA)','Gastos USD','Utilidad USD','Ingresos Bs (tasa actual)','Gastos Bs','Utilidad Bs'],...Object.keys(all).sort().map(m=>{const x=all[m];return [m,x.in.toFixed(2),x.out.toFixed(2),(x.in-x.out).toFixed(2),(x.in*S.rate).toFixed(2),(x.out*S.rate).toFixed(2),((x.in-x.out)*S.rate).toFixed(2)]})]); }
  if(k==='inv') csv('matriz_inventario',[['Producto','SKU','Precio USD','Precio Bs','Stock','Mínimo','Valor USD','Valor Bs','Estado'],...S.products.map(p=>[p.name,p.sku,p.price_usd,(p.price_usd*S.rate).toFixed(2),p.stock,p.min_stock,(p.stock*p.price_usd).toFixed(2),(p.stock*p.price_usd*S.rate).toFixed(2),p.stock<=p.min_stock?'Stock bajo':'OK'])]);
  if(k==='ven') csv('ventas',[['N°','Fecha','Cliente','Producto','Cantidad','Devuelto','Precio USD','Subtotal USD','IVA %','Estado'],...S.items.map(i=>{const s=S.sales.find(x=>x.id===i.sale_id)||{};return [i.sale_id,s.created_at,s.customer,i.name,i.qty,i.returned_qty,i.price_usd,((i.qty-i.returned_qty)*i.price_usd).toFixed(2),s.iva_pct,s.status]})]);
  if(k==='gas') csv('gastos',[['Fecha','Concepto','Categoría','USD','Bs'],...S.expenses.map(e=>[e.date,e.concept,e.category,e.amount_usd,(e.amount_usd*S.rate).toFixed(2)])]);
}
</script>
